[package]
name = "cdj3k-emu-wsl"
description = "Interactive Linux/WSL2 launcher for the CDJ-3000 emulator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cdj3k-emu-wsl"
path = "src/main.rs"

[dependencies]
cdj3k-emu-platform = { path = "../../crates/cdj3k-emu-platform" }
cdj3k-emu-runtime = { path = "../../crates/cdj3k-emu-runtime" }
cdj3k-emu-storage = { path = "../../crates/cdj3k-emu-storage" }
cdj3k-emu-streams = { path = "../../crates/cdj3k-emu-streams" }
cdj3k-emu-ui = { path = "../../crates/cdj3k-emu-ui" }
clap = { version = "=4.5.46", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
